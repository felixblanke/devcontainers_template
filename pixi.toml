# Dependencies, lockfile and tasks in one file. Commit pixi.lock.
#   pixi add scikit-image        add a conda-forge package
#   pixi add --pypi some-pkg     only if it isn't on conda-forge
#   pixi run test                run a task inside the environment
#   pixi shell                   interactive activated shell

[workspace]
name = "ml-project"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64"]

[dependencies]
python = "3.14.*"
numpy = ">=2.0"
fire = "*"
tqdm = "*"
scipy = "*"
pandas = "*"
matplotlib = "*"
seaborn = "*"
scikit-learn = "*"
pytorch = "2.13.*"          # CPU build; see the gpu environment below
ipykernel = "*"
pytest = "*"
ruff = "*"
einops = "*"

[tasks]
test = "pytest -q"
lint = "ruff check ."
fmt = "ruff format ."
check = { depends-on = ["fmt", "lint", "test"] }

# conda-forge ships the CUDA runtime, so no CUDA base image is needed --
# only a recent NVIDIA driver on the host.  pixi run -e gpu test
[feature.gpu.dependencies]
pytorch-gpu = "2.13.*"

[environments]
gpu = ["gpu"]

# Editable install of your own package, once you have a pyproject.toml:
# [pypi-dependencies]
# ml-project = { path = ".", editable = true }
